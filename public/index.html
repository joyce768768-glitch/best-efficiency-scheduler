<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最佳效率调度中心</title>
<link rel="stylesheet" href="style.css?v=1028">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div>
      <h1>最佳效率调度中心</h1>
      <p id="dateLine">—</p>
    </div>
  </div>
  <div class="topRight">
    <div class="stats" id="stats"></div>
    <button id="lanBtn" class="btn ghost sm hidden" title="复制手机访问地址">📱 手机访问</button>
    <div class="clock" id="clock">--:--</div>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main class="layout">
  <nav class="dateRail" id="dateRail"></nav>

  <section class="timeline">
    <div class="sectionHead">
      <h2 id="listTitle">今日任务</h2>
      <span class="hint" id="listHint">大任务挂截止时间 · 目标线 = 截止前 30 分钟</span>
    </div>
    <div id="taskList" class="taskList"></div>
  </section>

  <aside class="sidebar">
    <div class="card">
      <h3>＋ 新建大任务</h3>
      <p class="formTip">主路径：和我讨论 → 我自动填卡上板。此表单仅作人工补录。</p>
      <div class="form">
        <input id="fProject" type="text" placeholder="所属项目（Trae 项目名）" maxlength="30" list="projNames">
        <datalist id="projNames"></datalist>
        <input id="fTitle" type="text" placeholder="大任务标题" maxlength="40">
        <div class="row2">
          <label>截止时间
            <input id="fDeadline" type="time">
          </label>
          <label class="chk" style="margin-top:18px"><input id="fConfirm" type="checkbox"> 需人工确认</label>
        </div>
        <div class="stepsEditor">
          <div class="stepsEditorHead">
            <span>小任务（做什么 + 执行提示词）</span>
            <button type="button" id="addStepRow" class="btn ghost sm">＋小任务</button>
          </div>
          <div id="stepRows"></div>
        </div>
        <button id="fAdd" class="btn primary">添加到今日计划</button>
      </div>
    </div>
  </aside>
</main>

<script src="app.js?v=1028"></script>
</body>
</html>
